<!doctype html>
<html lang="ru" data-theme="dusk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToniVecherRadio · Вагон 4:20</title>
    <meta
      name="description"
      content="ToniVecherRadio · Вагон 4:20. Три канала deep-tech, tech и deep без треклистов, отметки на волне и чат."
    />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/site.webmanifest" />
    <meta name="theme-color" content="#29251f" />
    <link rel="preload" href="/fonts/files/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/files/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/files/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/files/manrope-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link id="radio-fonts" href="/fonts/fonts.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="radio-startup" role="status" style="min-height:100svh;display:grid;place-content:center;gap:16px;text-align:center;background:#29251f;color:#dfd3c0;font:16px/1.5 system-ui;padding:24px;box-sizing:border-box">
        <strong style="font-size:28px;font-weight:400">ToniVecherRadio</strong>
        <p id="radio-startup-message" style="margin:0">Открываем вагон...</p>
        <button id="radio-startup-retry" hidden type="button" style="margin:auto;padding:12px 20px;border:1px solid rgba(223,211,192,0.38);border-radius:24px;background:transparent;color:inherit;font:inherit">Повторить загрузку</button>
        <noscript>Для работы радио включите JavaScript в браузере.</noscript>
      </div>
    </div>
    <script>
      (() => {
        const showRetry = () => {
          const message = document.getElementById('radio-startup-message');
          const button = document.getElementById('radio-startup-retry');
          if (!message || !button) return;
          message.textContent = 'Загрузка занимает больше обычного. Можно повторить попытку.';
          button.hidden = false;
          button.onclick = () => location.reload();
        };
        window.setTimeout(showRetry, 20000);
        window.addEventListener('error', (event) => {
          if (event.target instanceof HTMLScriptElement) showRetry();
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
